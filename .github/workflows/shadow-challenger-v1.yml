name: AI Shadow Challenger v1 (paper only)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Investment Quant Post-Close Pipeline v2.13
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 14 * * 1-5' # 23:15 JST fallback when post-close pipeline is delayed

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  challenger:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1' pytest
      - name: Test challenger safety and accounting
        run: python -m pytest -q tests/test_shadow_challenger.py tests/test_decision_checkpoint.py
      - name: Run paper-only challenger
        run: python src/shadow_challenger.py
      - name: Upload independent paper results
        uses: actions/upload-artifact@v4
        with:
          name: shadow-challenger-v1
          path: |
            data/shadow_challenger/latest.json
            data/shadow_challenger/latest_report.md
            data/shadow_challenger/state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist paper-only ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_challenger
          if git diff --cached --quiet; then
            echo "No challenger updates"
            exit 0
          fi
          git commit -m "data: update shadow challenger v1"
          git pull --rebase
          git push
