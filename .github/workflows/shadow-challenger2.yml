name: AI Shadow Challenger 2 (5m paper parallel)

# Frozen at user request on 2026-11-06; no automatic or manual execution.
on:
  workflow_dispatch:

permissions:
  contents: write

# Keep this writer isolated from other workflow_run children. A shared
# concurrency group cancels older pending runs even when cancel-in-progress=false.
# This workflow commits only its own output directory; git pull --rebase
# handles unrelated commits from other paper-only writers.
concurrency:
  group: shadow-challenger2-writer
  cancel-in-progress: false

jobs:
  challenger2:
    if: ${{ false }} # Frozen; do not execute even on manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1' pytest
      - name: Validate original and fork isolation/accounting
        run: python -m pytest -q tests/test_shadow_challenger.py tests/test_shadow_challenger2.py
      - name: Run independent paper-only 5m challenger
        run: python src/shadow_challenger2.py
      - name: Upload independent audit files
        uses: actions/upload-artifact@v4
        with:
          name: shadow-challenger2-5m
          path: |
            data/shadow_challenger2/latest.json
            data/shadow_challenger2/latest_report.md
            data/shadow_challenger2/state.json
          if-no-files-found: error
          retention-days: 45
      - name: Persist challenger2 ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_challenger2
          if git diff --cached --quiet; then
            echo "No Challenger2 updates"
            exit 0
          fi
          git commit -m "data: update challenger2 isolated 5m paper ledger"
          # Independent output writers may commit simultaneously. Retry only
          # non-fast-forward races; never force-push or auto-resolve conflicts.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published output on attempt $attempt"
              exit 0
            fi
            if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
              echo "Rebase conflict: preserving both ledgers for manual review"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Output push failed after four attempts"
          exit 1
