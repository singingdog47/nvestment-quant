name: Private Runtime Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/private_runtime_readiness.py'
      - '.github/workflows/private-readiness.yml'
  schedule:
    - cron: '35 22 * * 0-4' # 07:35 JST weekdays, before the advice task
permissions:
  contents: read
concurrency:
  group: private-runtime-readiness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-regime.txt -r requirements-intelligence.txt
      - name: Real private-source roundtrip and deadline audit
        run: python -m src.private_runtime_readiness
      # Private data is never committed, logged or uploaded as an artifact.
