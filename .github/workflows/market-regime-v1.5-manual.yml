name: Market Regime v1.5 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/market_regime/**'
      - 'requirements-regime.txt'
      - '.github/workflows/market-regime-v1.5-manual.yml'

permissions:
  contents: read

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-regime.txt
      - run: python src/run_market_regime.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-regime-v1.5-diagnostic
          path: data/regime/
          retention-days: 7
