name: Private Portfolio Engine Tests v2.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/portfolio_policy.py'
      - 'src/portfolio_policy_report.py'
      - 'src/portfolio_valuation.py'
      - 'src/monthly_performance.py'
      - 'src/private_drive.py'
      - 'src/run_portfolio_risk.py'
      - 'src/final_report.py'
      - 'src/release_status.py'
      - 'config/portfolio_policy_v2_0.json'
      - 'tests/test_portfolio_policy.py'
      - 'tests/test_portfolio_policy_report.py'
      - 'tests/test_portfolio_valuation.py'
      - 'tests/test_monthly_performance.py'
      - 'tests/test_private_drive_history.py'
      - '.github/workflows/portfolio-policy-test.yml'

permissions:
  contents: read

jobs:
  private-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Validate policy JSON
        run: python -m json.tool config/portfolio_policy_v2_0.json > /dev/null
      - name: Run private portfolio engine tests
        run: python -m pytest tests/test_portfolio_policy.py tests/test_portfolio_policy_report.py tests/test_portfolio_valuation.py tests/test_monthly_performance.py tests/test_private_drive_history.py -q
      - name: Import smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from portfolio_policy import load_policy, evaluate_policy
          from portfolio_policy_report import build_policy_state
          from portfolio_valuation import build_portfolio_valuation
          from monthly_performance import build_monthly_diagnostics
          from private_drive import corrected_snapshot_name, file_sha256
          p = load_policy()
          assert p['version'] == '2.0.0'
          print(evaluate_policy({'household_defensive_cash_jpy':600000,'exploration_new_capital_cost_jpy':100000,'expected_return_definition':'geometric_cagr'}))
          print('private portfolio engine imports: ok')
          PY
