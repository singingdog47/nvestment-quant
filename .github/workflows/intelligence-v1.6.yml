name: Investment Intelligence v1.6

on:
  workflow_dispatch:
  schedule:
    # Morning refresh only: 07:15 JST weekdays (22:15 UTC previous day).
    # Post-close execution moved to post-close-pipeline-v2.2.yml.
    - cron: '15 22 * * 0-4'

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install v1.5/v1.6 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-regime.txt
          python -m pip install -r requirements-intelligence.txt
          python -m pip install pytest

      - name: Preflight v1.3 compatibility
        run: python tools/preflight_v1_3.py --ci

      - name: Update Market Regime Engine v1.5
        run: python src/run_market_regime.py

      - name: Update Company Intelligence v1.6
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ALLOW_REPO_PORTFOLIO: '0'
        run: python src/run_company_intel.py

      - name: Update Exception Alerts v1.9
        env:
          RANK_ALERT_THRESHOLD: '15'
          ALERT_VIX_WATCH: '20'
          ALERT_VIX_WARNING: '30'
          ALERT_VIX_CRITICAL: '35'
        run: python src/run_alerts.py

      - name: Run v1.6-v1.9 smoke tests
        run: python -m pytest -q tests

      - name: Verify v1.6 outputs
        run: python tools/verify_outputs.py

      - name: Commit public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/regime \
            data/data_coverage_latest.json \
            data/intelligence \
            data/alerts \
            data/state \
            data/ai_context_latest.md \
            data/decision_context_latest.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh morning intelligence and alerts"
          git push
