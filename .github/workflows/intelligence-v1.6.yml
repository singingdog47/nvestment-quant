name: Investment Intelligence v1.6

on:
  workflow_dispatch:
  schedule:
    # 07:15 JST weekdays (22:15 UTC previous day)
    - cron: '15 22 * * 0-4'
    # 16:30 JST weekdays, after existing v1.3 Daily Quant Screen at 16:17 JST
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: investment-intelligence-v1-6
  cancel-in-progress: true

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install v1.5/v1.6 dependencies
        run: |
          pip install -r requirements-regime.txt
          pip install -r requirements-intelligence.txt
      - name: Preflight v1.3 compatibility
        run: python tools/preflight_v1_3.py --ci
      - name: Update Market Regime Engine v1.5
        run: python src/run_market_regime.py
      - name: Update Company Intelligence v1.6
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ALLOW_REPO_PORTFOLIO: '0'
        run: python src/run_company_intel.py
      - name: Run v1.6 smoke tests
        run: pytest -q tests
      - name: Commit public-safe outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/regime data/intelligence data/state data/ai_context_latest.md data/decision_context_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh v1.6 intelligence"
          git push
