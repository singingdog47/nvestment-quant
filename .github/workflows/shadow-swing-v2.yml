name: AI Shadow Swing v2 Adversarial

# Archived paper strategy: manual dispatch only; scheduled and upstream triggers disabled.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  paper-v2:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1'
          python -m pip install pytest
      - name: Validate adversarial and legacy safety guards
        run: python -m pytest -q tests/test_shadow_swing.py tests/test_shadow_swing_v2.py
      - name: Run independent no-money virtual book
        run: python src/shadow_swing_v2.py
      - name: Publish audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-shadow-swing-v2-5m-critical-review
          path: |
            data/shadow_swing_v2/state.json
            data/shadow_swing_v2/latest.json
            data/shadow_swing_v2/latest_report.md
            data/shadow_swing_v2/adversarial_review_latest.json
            data/shadow_swing_v2/equity_curve.csv
            data/shadow_swing_v2/trades.csv
          if-no-files-found: warn
          retention-days: 45
      - name: Save isolated public virtual ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_swing_v2
          if git diff --cached --quiet; then
            echo "No v2 ledger changes."
            exit 0
          fi
          git commit -m "data: record v2 shadow swing paper cohort"
          git pull --rebase
          git push
