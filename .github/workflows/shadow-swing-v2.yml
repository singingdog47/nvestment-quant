name: AI Shadow Swing v2 Research
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/shadow-swing-v2.yml','src/shadow_swing_v2.py','src/run_shadow_swing_v2.py','config/shadow_swing_v2.json','tests/test_shadow_swing_v2.py']
  schedule:
    - cron: '5 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: repository-output-writer
  cancel-in-progress: false
jobs:
  shadow-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Verify v2 research invariants
        run: python -m pytest -q tests/test_shadow_swing_v2.py
      - name: Run v2 hypothesis screen
        run: python src/run_shadow_swing_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-shadow-swing-v2-latest
          path: data/shadow_swing_v2
          retention-days: 90
      - name: Persist v2 research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_swing_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update AI shadow swing v2 research"
          git pull --rebase
          git push
