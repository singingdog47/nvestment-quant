name: Private Trade Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/private_trade_review.py'
      - '.github/workflows/private-trade-review.yml'
  schedule:
    - cron: '55 7 * * 1-5' # 16:55 JST weekdays

permissions:
  contents: read

concurrency:
  group: private-trade-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: Build private report and verify Drive readback
        run: python -m src.private_trade_review --writeback
