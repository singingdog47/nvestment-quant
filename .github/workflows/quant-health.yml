name: Quant Health Snapshot for ChatGPT

on:
  push:
    branches: [main]
    paths:
      - 'src/health_report.py'
      - 'src/jpx_market_calendar.py'
      - 'src/ai_ma_shadow.py'
      - '.github/workflows/quant-health.yml'
  pull_request:
    paths:
      - 'src/health_report.py'
      - 'tests/test_health_report.py'
      - '.github/workflows/quant-health.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Investment Intelligence v1.6]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '40 13 * * 1-5' # 22:40 JST, after both paper cohorts

permissions:
  contents: write

# Keep this writer isolated from other workflow_run children. A shared
# concurrency group cancels older pending runs even when cancel-in-progress=false.
# This workflow commits only its own output directory; git pull --rebase
# handles unrelated commits from other paper-only writers.
concurrency:
  group: quant-health-writer
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health classification
        run: python -m unittest discover -s tests -p 'test_health_report.py' -v
      - name: Build human-readable status
        run: python src/health_report.py
      - name: Publish health status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-health-latest
          path: data/health/latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit observer-only health status
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/health/latest.json
          if git diff --cached --quiet; then
            echo "No health changes."
            exit 0
          fi
          git commit -m "data: update quant health snapshot"
          # Independent output writers may commit simultaneously. Retry only
          # non-fast-forward races; never force-push or auto-resolve conflicts.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published output on attempt $attempt"
              exit 0
            fi
            if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
              echo "Rebase conflict: preserving both ledgers for manual review"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Output push failed after four attempts"
          exit 1
