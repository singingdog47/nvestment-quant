name: Quant Health Snapshot for ChatGPT

on:
  pull_request:
    paths:
      - 'src/health_report.py'
      - 'tests/test_health_report.py'
      - '.github/workflows/quant-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 13 * * 1-5' # 22:40 JST, after both paper cohorts

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health classification
        run: python -m unittest discover -s tests -p 'test_health_report.py' -v
      - name: Build human-readable status
        run: python src/health_report.py
      - name: Publish health status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-health-latest
          path: data/health/latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit observer-only health status
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/health/latest.json
          if git diff --cached --quiet; then
            echo "No health changes."
            exit 0
          fi
          git commit -m "data: update quant health snapshot"
          git pull --rebase
          git push
