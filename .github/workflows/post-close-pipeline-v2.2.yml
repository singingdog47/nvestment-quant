name: Investment Quant Post-Close Pipeline v2.3

on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "動作確認用。0=全銘柄、例: 20"
        required: false
        default: "0"
  schedule:
    # 16:17 JST weekdays. One orchestrated run replaces the previous
    # independently scheduled post-close component workflows.
    - cron: '17 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  post-close:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MAX_TICKERS: ${{ inputs.max_tickers || '0' }}
      OUTPUT_TOP_N: '100'
      PYTHONPATH: src
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      ALLOW_REPO_PORTFOLIO: '0'
      PORTFOLIO_DRIVE_WRITEBACK: 'false'
      PRIVATE_WORKDIR: .private
      PRIVATE_OUTPUT_DIR: .private/portfolio_risk
      SCREEN_PATH: data/screening_latest.csv
      RISK_LOOKBACK_DAYS: '400'
      RISK_MIN_OBSERVATIONS: '120'
      RISK_VAR_CONFIDENCE: '0.95'
      RISK_CANDIDATE_WEIGHT: '0.02'
      RISK_CANDIDATE_TOP_N: '10'
      RISK_BENCHMARK: '1306.T'
      RANK_ALERT_THRESHOLD: '15'
      ALERT_VIX_WATCH: '20'
      ALERT_VIX_WARNING: '30'
      ALERT_VIX_CRITICAL: '35'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install all pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-regime.txt
          python -m pip install -r requirements-intelligence.txt
          python -m pip install pytest

      - name: Run full test suite once
        run: python -m pytest -q tests

      - name: 1. Daily Quant Screen
        run: python -m src.main

      - name: 2. Preflight screening compatibility
        run: python tools/preflight_v1_3.py --ci

      - name: 3. Market Regime Engine
        run: python src/run_market_regime.py

      - name: 4. Company Intelligence
        run: python src/run_company_intel.py

      - name: 5. Exception Alerts
        run: python src/run_alerts.py

      - name: 6. Verify public intelligence outputs
        run: python tools/verify_outputs.py

      - name: 7. Decision validation and benchmark-relative learning
        run: python src/run_validation.py

      - name: Check private Drive configuration
        id: private_config
        shell: bash
        run: |
          if [[ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" && -n "$GDRIVE_FOLDER_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Private Google Drive secrets are not configured; private risk analysis skipped."
          fi

      - name: 8. Private Portfolio Risk Engine
        if: steps.private_config.outputs.configured == 'true'
        run: python src/run_portfolio_risk.py

      - name: 9. Final Integrated Daily Report v2.3
        if: always() && !cancelled()
        run: python src/run_final_report.py

      - name: Preserve public quality report in run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: data/quality_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit public-safe outputs once
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add -- \
            data/screening_latest.csv \
            data/screening_full.csv.gz \
            data/quality_report.json \
            data/daily_report.md \
            data/integrated_report_latest.md \
            data/regime \
            data/intelligence \
            data/alerts \
            data/state \
            data/ai_context_latest.md \
            data/decision_context_latest.json \
            data/validation
          if git diff --cached --quiet; then
            echo "No post-close output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh integrated post-close pipeline v2.3"
          git push

      # Privacy rule: portfolio inputs and private risk outputs, including the
      # private integrated appendix, remain only in the ephemeral runner workspace.
      # They are never committed or uploaded as public Actions artifacts.
