name: AI / M&A Restructuring Shadow Research v1

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Investment Quant Post-Close Pipeline v2.13
    types: [completed]
    branches: [main]
  schedule:
    - cron: '55 12 * * 1-5' # 21:55 JST fallback

permissions:
  contents: write

# Keep this writer isolated from other workflow_run children. A shared
# concurrency group cancels older pending runs even when cancel-in-progress=false.
# This workflow commits only its own output directory; git pull --rebase
# handles unrelated commits from other paper-only writers.
concurrency:
  group: ai-ma-shadow-writer
  cancel-in-progress: false

jobs:
  research-paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1'
          python -m pip install pytest
      - name: Validate AI-MA paper rules
        run: python -m pytest -q tests/test_ai_ma_shadow.py tests/test_ai_ma_historical.py
      - name: Run separate virtual study
        run: python src/ai_ma_shadow.py
      - name: Refresh historical feasibility and evidence audit
        run: python src/ai_ma_historical.py
      - name: Upload no-money public paper audit
        uses: actions/upload-artifact@v4
        with:
          name: ai-ma-shadow-research-v1
          path: |
            data/ai_ma_shadow/latest.json
            data/ai_ma_shadow/latest_report.md
            data/ai_ma_shadow/equity_curve.csv
            data/ai_ma_shadow/historical/historical_audit_latest.json
            data/ai_ma_shadow/historical/historical_audit_latest.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit independent research ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ai_ma_shadow
          if git diff --cached --quiet; then
            echo "No cohort changes"
            exit 0
          fi
          git commit -m "data: AI-MA standalone virtual study"
          # Independent output writers may commit simultaneously. Retry only
          # non-fast-forward races; never force-push or auto-resolve conflicts.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published output on attempt $attempt"
              exit 0
            fi
            if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
              echo "Rebase conflict: preserving both ledgers for manual review"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Output push failed after four attempts"
          exit 1
