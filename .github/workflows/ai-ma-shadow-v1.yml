name: AI / M&A Restructuring Shadow Research v1

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Investment Quant Post-Close Pipeline v2.13
    types: [completed]
    branches: [main]
  schedule:
    - cron: '55 12 * * 1-5' # 21:55 JST fallback

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  research-paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1'
          python -m pip install pytest
      - name: Validate AI-MA paper rules
        run: python -m pytest -q tests/test_ai_ma_shadow.py
      - name: Run separate virtual study
        run: python src/ai_ma_shadow.py
      - name: Upload no-money public paper audit
        uses: actions/upload-artifact@v4
        with:
          name: ai-ma-shadow-research-v1
          path: |
            data/ai_ma_shadow/latest.json
            data/ai_ma_shadow/latest_report.md
            data/ai_ma_shadow/equity_curve.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Commit independent research ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ai_ma_shadow
          if git diff --cached --quiet; then
            echo "No cohort changes"
            exit 0
          fi
          git commit -m "data: AI-MA standalone virtual study"
          git pull --rebase
          git push
