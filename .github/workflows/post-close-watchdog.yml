name: Investment Quant Post-Close Watchdog

on:
  schedule:
    # Redundant checks: GitHub scheduled jobs can be delayed or occasionally dropped.
    # Each run is idempotent and dispatches only if no fresh output or active recovery exists.
    - cron: '42 7 * * 1-5'
    - cron: '12 8 * * 1-5'
    - cron: '42 8 * * 1-5'
    - cron: '12 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: post-close-watchdog
  cancel-in-progress: false

jobs:
  ensure-post-close-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Check whether a completed JPX post-close session needs recovery
        id: freshness
        env:
          PYTHONPATH: src
        run: python tools/post_close_watchdog_gate.py

      - name: Dispatch primary post-close pipeline when stale or missing
        if: steps.freshness.outputs.fresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active_count="$({ gh run list --workflow post-close-pipeline-v2.2.yml --status in_progress --json databaseId --jq 'length'; gh run list --workflow post-close-pipeline-v2.2.yml --status queued --json databaseId --jq 'length'; } | awk '{s+=$1} END {print s+0}')"
          if [[ "$active_count" -gt 0 ]]; then
            echo "Primary report is stale, but a post-close run is already active; no duplicate dispatch."
            exit 0
          fi
          echo "Primary report is stale/missing and no run is active; dispatching recovery run."
          gh workflow run post-close-pipeline-v2.2.yml --ref main -f max_tickers=0

      - name: Confirm no recovery dispatch is needed
        if: steps.freshness.outputs.fresh == 'true'
        run: echo "Report is fresh for the completed JPX session, or no JPX session is eligible; no recovery dispatch needed."
