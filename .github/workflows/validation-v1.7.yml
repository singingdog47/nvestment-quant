name: Decision Validation v1.7

on:
  workflow_dispatch:

# Superseded for scheduled production use by Validation Learning v2.1 inside
# post-close-pipeline-v2.2.yml. Kept manual-only for diagnostics/backward checks.

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-intelligence.txt
          python -m pip install pytest

      - name: Run decision validation v1.7 compatibility path
        env:
          PYTHONPATH: src
        run: python src/run_validation.py

      - name: Run validation tests
        run: python -m pytest -q tests/test_decision_log.py

      - name: Commit public-safe validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/validation
          if git diff --cached --quiet; then
            echo "No validation output changes to commit."
            exit 0
          fi
          git commit -m "data: capture manual decision validation"
          git push
