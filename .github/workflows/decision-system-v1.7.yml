name: Decision Validation System v1.7

on:
  workflow_dispatch:
    inputs:
      human_action:
        description: "Optional actual action: BUY / WAIT / REDUCE / TAKE_PROFIT / OTHER"
        required: false
        default: "NOT_RECORDED"
      human_action_note:
        description: "Optional note about the actual human decision"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'src/decision_system.py'
      - 'src/run_decision_system.py'
      - 'tests/test_decision_system.py'
      - '.github/workflows/decision-system-v1.7.yml'
      - 'README_UPGRADE_v1.6_to_v1.7.md'
  schedule:
    # Run after the morning and post-close intelligence refreshes.
    # 07:45 JST weekdays (22:45 UTC previous day)
    - cron: '45 22 * * 0-4'
    # 16:45 JST weekdays
    - cron: '45 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  validate-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Private portfolio information must not be inferred from the public repo.
      ALLOW_REPO_PORTFOLIO: '0'
      HUMAN_ACTION: ${{ inputs.human_action || 'NOT_RECORDED' }}
      HUMAN_ACTION_NOTE: ${{ inputs.human_action_note || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Run Decision Validation System v1.7
        run: python src/run_decision_system.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-validation-v1.7
          path: |
            data/decision_system
            data/decision_log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit public-safe validation outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add -- data/decision_system data/decision_log
          if git diff --cached --quiet; then
            echo "No v1.7 output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh v1.7 decision validation"
          git push
