name: AI Shadow Challenger 1 5m (independent paper fork)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Investment Quant Post-Close Pipeline v2.13
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 14 * * 1-5' # 23:35 JST fallback; 11/3 JPX holiday is guarded in runner

permissions:
  contents: write

concurrency:
  group: shadow-challenger1-5m-writer
  cancel-in-progress: false

jobs:
  challenger1_5m:
    if: ${{ false }} # Frozen; do not execute even on manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1' pytest
      - name: Verify independent fork and OHLC accounting
        run: python -m pytest -q tests/test_shadow_challenger.py tests/test_shadow_challenger2.py tests/test_shadow_challenger1_5m.py
      - name: Run independent 5m paper-only fork
        run: python src/shadow_challenger1_5m.py
      - name: Upload independent audit files
        uses: actions/upload-artifact@v4
        with:
          name: shadow-challenger1-5m
          path: |
            data/shadow_challenger1_5m/latest.json
            data/shadow_challenger1_5m/latest_report.md
            data/shadow_challenger1_5m/state.json
          if-no-files-found: warn
          retention-days: 45
      - name: Persist independent fork ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_challenger1_5m
          if git diff --cached --quiet; then
            echo "No Challenger1 5m updates"
            exit 0
          fi
          git commit -m "data: update independent challenger1 5m paper ledger"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published fork output on attempt $attempt"
              exit 0
            fi
            if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
              echo "Rebase conflict: fail closed and preserve independent ledgers"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Output push failed after four attempts"
          exit 1
