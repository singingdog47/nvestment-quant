name: PTS Observer v1

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"   # 17:30 JST
    - cron: "30 11 * * 1-5"  # 20:30 JST
    - cron: "45 20 * * 1-5"  # 05:45 JST (next calendar day)

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q tests/test_pts_observer.py
      - name: Score PTS observations
        run: PYTHONPATH=src python src/run_pts_observer.py
      - name: Persist research observations
        run: |
          if [ -d data/pts_observer ] && ! git diff --quiet -- data/pts_observer; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pts_observer
            git commit -m "data: update PTS observer research"
            git pull --rebase
            git push
          fi
