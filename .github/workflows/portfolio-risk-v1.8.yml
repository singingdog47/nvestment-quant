name: Portfolio Risk Engine v1.9

on:
  workflow_dispatch:

# Scheduled private portfolio-risk execution moved to
# post-close-pipeline-v2.2.yml so it uses the same-day screening/intelligence
# snapshot in a deterministic sequence. This workflow remains manual-only.

permissions:
  contents: read

concurrency:
  group: private-portfolio-risk
  cancel-in-progress: true

jobs:
  portfolio-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PORTFOLIO_RISK_PROFILE_JSON: ${{ secrets.PORTFOLIO_RISK_PROFILE_JSON }}
      PORTFOLIO_RISK_OVERLAY_CSV: ${{ secrets.PORTFOLIO_RISK_OVERLAY_CSV }}
      PORTFOLIO_DRIVE_FILENAME: portfolio_latest.csv
      PORTFOLIO_DRIVE_WRITEBACK: 'false'
      PRIVATE_WORKDIR: .private
      PRIVATE_OUTPUT_DIR: .private/portfolio_risk
      SCREEN_PATH: data/screening_latest.csv
      RISK_LOOKBACK_DAYS: '400'
      RISK_MIN_OBSERVATIONS: '120'
      RISK_VAR_CONFIDENCE: '0.95'
      RISK_CANDIDATE_WEIGHT: '0.02'
      RISK_CANDIDATE_TOP_N: '10'
      RISK_BENCHMARK: '1306.T'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-intelligence.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check private Drive configuration
        id: private_config
        shell: bash
        run: |
          if [[ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" && -n "$GDRIVE_FOLDER_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Private Google Drive secrets are not configured; risk run skipped."
          fi

      - name: Run private portfolio risk analysis
        if: steps.private_config.outputs.configured == 'true'
        run: python src/run_portfolio_risk.py

      # Privacy rule: Drive is input-only by default. Portfolio inputs/results
      # stay only in the ephemeral runner workspace. Never upload them as Actions
      # artifacts and never commit them to this public repository.
