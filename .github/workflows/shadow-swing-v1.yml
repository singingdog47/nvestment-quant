name: AI Shadow Swing v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shadow-swing-v1.yml'
      - 'src/shadow_swing.py'
      - 'src/run_shadow_swing.py'
      - 'config/shadow_swing_v1.json'
      - 'tests/test_shadow_swing.py'
  schedule:
    - cron: '50 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  shadow-swing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify shadow safety invariants
        run: python -m pytest -q tests/test_shadow_swing.py
      - name: Run virtual account ledger
        run: python src/run_shadow_swing.py
      - name: Upload shadow account report
        uses: actions/upload-artifact@v4
        with:
          name: ai-shadow-swing-latest
          path: |
            data/shadow_swing/latest.json
            data/shadow_swing/latest_report.md
            data/shadow_swing/state.json
            data/shadow_swing/equity_curve.csv
            data/shadow_swing/orders.jsonl
            data/shadow_swing/trades.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Persist virtual account state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_swing
          if git diff --cached --quiet; then
            echo "No shadow account changes to commit."
            exit 0
          fi
          git commit -m "data: update AI shadow swing ledger"
          git pull --rebase
          git push
