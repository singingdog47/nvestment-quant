name: AI Shadow Swing v1

# Archived paper strategy: manual dispatch only; scheduled and upstream triggers disabled.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  shadow-swing:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'yfinance>=0.2.65,<1'
          python -m pip install pytest
      - name: Verify shadow safety invariants
        run: python -m pytest -q tests/test_shadow_swing.py
      - name: Run virtual account ledger
        run: python src/run_shadow_swing.py
      - name: Upload shadow account report
        uses: actions/upload-artifact@v4
        with:
          name: ai-shadow-swing-latest
          path: |
            data/shadow_swing/latest.json
            data/shadow_swing/latest_report.md
            data/shadow_swing/state.json
            data/shadow_swing/equity_curve.csv
            data/shadow_swing/orders.jsonl
            data/shadow_swing/trades.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Persist virtual account state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_swing
          if git diff --cached --quiet; then
            echo "No shadow account changes to commit."
            exit 0
          fi
          git commit -m "data: update AI shadow swing ledger"
          git pull --rebase
          git push
      - name: Flag unresolved hard-stop execution failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/shadow_swing/latest.json").read_text())
          integrity = report.get("execution_integrity", {})
          status = integrity.get("status")
          if status == "BLOCKED_EXIT":
              print("::error::Pending SELL could not be executed: verified OHLC unavailable")
              print(json.dumps(integrity, ensure_ascii=False, indent=2))
              raise SystemExit(1)
          if status in ("OVERDUE_EXIT", "DELAYED_EXECUTION"):
              print("::warning::Shadow execution quality requires review: " + str(status))
          PY
