name: Validation Learning v2.0

on:
  workflow_dispatch:
  schedule:
    # 17:35 JST weekdays, after decision validation.
    - cron: '35 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: repository-output-writer
  cancel-in-progress: false

jobs:
  validate-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-intelligence.txt
          python -m pip install pytest

      - name: Run validation and learning
        env:
          PYTHONPATH: src
        run: python src/run_validation.py

      - name: Run validation-learning tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_decision_log.py tests/test_validation_learning.py

      - name: Commit public-safe validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/validation
          if git diff --cached --quiet; then
            echo "No validation-learning output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh validation learning v2"
          git push
