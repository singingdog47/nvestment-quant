name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-regime.txt -r requirements-intelligence.txt

      - name: Run test suite
        run: python -m pytest -q tests

      - name: Live EDINET and SEC smoke test
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from company_intel.edinet import fetch_edinet
          from company_intel.sec import fetch_sec

          jp = pd.DataFrame([
              {"market": "JP", "code": "7203", "ticker": "7203.T", "name": "Toyota Motor"}
          ])
          us = pd.DataFrame([
              {"market": "US", "code": "AAPL", "ticker": "AAPL", "name": "Apple"}
          ])

          _, edinet_health = fetch_edinet(jp, lookback_days=1)
          _, sec_health = fetch_sec(us, forms={"10-Q", "10-K", "8-K"}, lookback_days=45)

          print(f"EDINET status={edinet_health.status} count={edinet_health.count} error={edinet_health.error}")
          print(f"SEC status={sec_health.status} count={sec_health.count} error={sec_health.error}")

          bad = []
          if edinet_health.status not in {"ok", "partial"}:
              bad.append(f"EDINET:{edinet_health.status}:{edinet_health.error}")
          if sec_health.status not in {"ok", "partial"}:
              bad.append(f"SEC:{sec_health.status}:{sec_health.error}")
          if bad:
              raise SystemExit(" | ".join(bad))
          PY
