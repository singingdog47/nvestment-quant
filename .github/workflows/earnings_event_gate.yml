name: Earnings event gate tests
on:
  pull_request:
    paths:
      - 'src/earnings_event_gate.py'
      - 'src/portfolio_event_preflight.py'
      - 'src/disclosure_candidates.py'
      - 'src/jquants_tdnet_adapter.py'
      - 'src/yanoshin_disclosure_adapter.py'
      - 'src/run_free_disclosure_preflight.py'
      - 'tests/test_earnings_event_gate.py'
      - 'tests/test_portfolio_event_preflight.py'
      - 'tests/test_disclosure_candidates.py'
      - 'tests/test_jquants_tdnet_adapter.py'
      - 'tests/test_yanoshin_disclosure_adapter.py'
      - 'tests/test_run_free_disclosure_preflight.py'
      - '.github/workflows/earnings_event_gate.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run event gate regression tests
        run: python -m unittest discover -s tests -p 'test_*event*gate*.py' -v
      - name: Run disclosure candidate regression tests
        run: python -m unittest discover -s tests -p 'test_disclosure_candidates.py' -v
      - name: Run licensed adapter mock tests
        run: python -m unittest discover -s tests -p 'test_jquants_tdnet_adapter.py' -v
      - name: Run free Atom adapter tests
        run: python -m unittest discover -s tests -p 'test_yanoshin_disclosure_adapter.py' -v
      - name: Run free preflight CLI unit tests
        run: python -m unittest discover -s tests -p 'test_run_free_disclosure_preflight.py' -v
      - name: Run portfolio preflight regression tests
        run: python -m unittest discover -s tests -p 'test_portfolio_event_preflight.py' -v
