version: 1.5.3
compatibility_base: 1.3
market_symbols:
  JP_NIKKEI: "^N225"
  JP_TOPIX_PROXY: "1306.T"
  US_SP500: "^GSPC"
  US_NASDAQ: "^IXIC"
  VIX: "^VIX"
  USDJPY: "JPY=X"
  US10Y: "^TNX"
  GOLD: "GC=F"
  WTI: "CL=F"
  COPPER: "HG=F"
  TLT: "TLT"
  HYG: "HYG"
  LQD: "LQD"
market_history_period: "1y"
market_history_interval: "1d"
fred_series:
  HY_OAS: "BAMLH0A0HYM2"
  IG_OAS: "BAMLC0A0CM"
  NFCI: "NFCI"
  FED_FUNDS: "DFF"
jpx_sources:
  investor_type:
    enabled: true
    pages: ["https://www.jpx.co.jp/english/markets/statistics-equities/investor-type/index.html", "https://www.jpx.co.jp/markets/statistics-equities/investor-type/index.html"]
    keywords: ["xls", "xlsx", "csv"]
    validation: {min_rows: 2, min_columns: 2, min_numeric_values: 1}
  short_selling:
    enabled: true
    pages: ["https://www.jpx.co.jp/markets/statistics-equities/short-selling/index.html", "https://www.jpx.co.jp/english/markets/statistics-equities/short-selling/index.html"]
    keywords: ["pdf"]
    validation: {min_rows: 1, min_columns: 2, min_numeric_values: 1}
  margin:
    enabled: true
    pages: ["https://www.jpx.co.jp/english/markets/statistics-equities/margin/index.html", "https://www.jpx.co.jp/markets/statistics-equities/margin/index.html"]
    keywords: ["xls", "xlsx", "csv"]
    validation: {min_rows: 2, min_columns: 2, min_numeric_values: 1}
cftc:
  enabled: true
  contracts: ["S&P 500", "NASDAQ", "JAPANESE YEN", "U.S. DOLLAR INDEX", "10-YEAR U.S. TREASURY"]
treasury_volatility:
  enabled: true
  window_days: 20
  percentile_lookback_days: 252
  minimum_observations: 60
  shock_percentile: 0.90
  cache_max_age_days: 7
breadth:
  source_candidates: ["data/screening_full.csv.gz", "data/screening_latest.csv"]
  min_universe: 100
  max_business_age_days: 1
sq_execution_overlay:
  enabled: true
  role: "execution_timing_only"
  major_months: [3, 6, 9, 12]
  activation_calendar_days: 6
  caution_cap_points: 15
  flag_threshold_points: 6
  max_input_age_days: 3
  pin_distance_window_pct: 0.03
  manual_input_path: "data/regime/sq_manual_input_latest.json"
  date_overrides: {}
  policy:
    alter_security_ranking: false
    alter_fundamental_score: false
    alter_investment_thesis: false
    use_for_execution_timing_only: true
  source_policy:
    note: "Calendar proximity is automatic. Strike-level option/futures OI, arbitrage z-score, and Nikkei VI percentile are optional structured enrichments; missing fields are never inferred."
    official_reference_pages:
      derivatives_open_interest: "https://www.jpx.co.jp/markets/derivatives/trading-volume/index.html"
      derivatives_daily_report: "https://www.jpx.co.jp/english/markets/statistics-derivatives/daily/"
      arbitrage_trading: "https://www.jpx.co.jp/english/markets/statistics-equities/program/index.html"
scoring:
  weights:
    trend: 0.30
    stress: 0.25
    participation: 0.20
    liquidity: 0.15
    positioning: 0.10
  actionable_min_confidence: 0.60
  labels:
    risk_on: 70
    constructive: 58
    neutral: 42
    defensive: 30
freshness:
  market_hours: 36
  fred_hours: 96
  fred_cache_max_age_days: 14
  jpx_hours: 240
  cftc_hours: 240
coverage:
  manifest_path: data/data_coverage_latest.json
  not_implemented:
    - source: MOVE
      description: licensed ICE BofA MOVE Index is not integrated; the engine uses a separately labelled official-Treasury realized-yield-volatility proxy
    - source: EQUITY_PUT_CALL
      description: official broad equity put/call series is not integrated; SQ overlay can consume explicitly sourced Nikkei 225 option OI when available
    - source: SQ_AUTOMATIC_STRIKE_OI
      description: automatic strike-level Nikkei 225 option/futures open-interest extraction is not yet production-integrated; calendar-only SQ mode remains active and never invents missing OI or gamma direction
    - source: MARKET_52W_HIGH_LOW
      description: 52-week high/low breadth is unavailable when screening columns are absent
outputs:
  directory: data/regime
  state_directory: data/state
